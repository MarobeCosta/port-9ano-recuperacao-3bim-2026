<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperação 3º bimestre · A Tela que Desliga o Saber</title>
<style>
:root{
  --tinta:#16211C; --papel:#F5F8F6; --card:#FFFFFF; --linha:#C8D4CE;
  --faixa:#14181A; --faixa2:#2A3236;
  --roxo:#B9A8D8; --roxof:#F4F0FA;
  --verde:#A8CBA0; --verdef:#EFF7ED;
  --azul:#A3C2DE;  --azulf:#EEF4FA;
  --laranja:#E0BE95; --laranjaf:#FBF3EA;
  --rosa:#D9AFC9; --rosaf:#FAEFF6;
  --FAIXA_W:78px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);
  font:17px/1.62 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:0 0 108px}

/* ───── topo ───── */
#topo{position:sticky;top:0;z-index:40;background:var(--tinta);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#topo .tt{font-size:18px;font-weight:700}
#topo .ver{margin-left:auto;font-size:14px;opacity:.85}
#topo .eu{font-size:14px;opacity:.9;width:100%}

/* ───── palco + faixa ───── */
#area{position:relative;max-width:1000px;margin:0 auto;padding:14px 14px 0}
#palco{padding-right:calc(var(--FAIXA_W) + 22px);position:relative}
#faixa{position:absolute;top:0;right:14px;width:var(--FAIXA_W);min-height:100%;
  background:linear-gradient(180deg,var(--faixa2),var(--faixa) 22%,var(--faixa) 78%,var(--faixa2));
  border-radius:16px;padding:10px 4px}
#faixa .vazio{color:#6D7A80;font-size:13px;text-align:center;line-height:1.3;margin:6px 0 0}
#fios{position:absolute;inset:0;pointer-events:none;z-index:5}

/* ───── cartões ───── */
.card{background:var(--card);border:4px solid var(--linha);border-radius:18px;
  padding:14px 16px 16px;margin:0 0 14px}
.bloco{border:4px solid;border-radius:17px;padding:13px 15px 15px;margin:0 0 14px}
.bl1{border-color:var(--roxo);background:var(--roxof)}
.bl2{border-color:var(--verde);background:var(--verdef)}
.bl3{border-color:var(--azul);background:var(--azulf)}
.bl4{border-color:var(--laranja);background:var(--laranjaf)}
.bl5{border-color:var(--rosa);background:var(--rosaf)}
h2{margin:0 0 6px;font-size:21px;line-height:1.3;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cnum{display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:31px;
  border-radius:50%;background:var(--tinta);color:#fff;font-size:16px;font-weight:700;padding:0 7px;flex:none}
.sub{font-size:15px;opacity:.85;margin:0 0 11px}

/* ───── botões ───── */
.bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.esc{position:relative;text-align:left;background:#fff;border:4px solid var(--linha);
  border-radius:15px;padding:12px 13px 12px 15px;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}
.esc.on{border-color:var(--tinta);background:#F0F5F2}
.esc .tick{position:absolute;top:9px;right:11px;font-size:20px;line-height:1}
.esc .cnum{margin:0 0 6px}
.esc b{display:block;font-size:17px;margin:2px 0 0}
.esc .d{display:block;font-size:14px;opacity:.82;margin:3px 0 0}
.turmas{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.turmas .esc{text-align:center;padding:14px 8px}
.turmas .esc b{font-size:21px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px 13px;
  border:4px solid var(--linha);border-radius:15px;background:#fff;color:inherit}

/* ───── a leitura ───── */
.par{position:relative;margin:0 0 16px;padding:11px 13px;border:4px solid transparent;border-radius:15px}
.par.estr{border-color:var(--linha);background:#fff}
/* 🔴 CLD-036 · os 2 cards do parágrafo (Marcos, 02/10 01:37 e 01:43): cabeçalho na cor da etapa, texto em branco */
.par.estr{border:0 !important;background:transparent !important;padding:0 !important}
.par.estr .parcab{border:4px solid var(--pc);background:var(--pbg);border-radius:15px 15px 0 0;padding:10px 13px;margin:0 !important}
.par.estr .parcab .pn{background:var(--pc) !important;color:#fff !important}
.par.estr .parcab .rot{color:var(--pc);font-weight:900}
.par.estr .parcab .dz{color:#2B2B2B;opacity:1}
.par.estr .tx{border:4px solid var(--pc);border-top:0;background:#fff;border-radius:0 0 15px 15px;padding:8px 13px}
.parcab{display:none;align-items:center;gap:9px;margin:0 0 7px;flex-wrap:wrap}
.par.estr .parcab{display:flex}
.parcab .pn{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;
  border-radius:50%;background:var(--tinta);color:#fff;font-size:15px;font-weight:700;flex:none}
.parcab .rot{font-size:15px;font-weight:700}
.parcab .dz{font-size:14px;opacity:.8;width:100%;margin:0 0 0 38px}
.tx{font-size:17px;line-height:1.75;text-align:justify}

mark.mk{background:transparent;color:inherit;padding:1px 2px;border-radius:5px;cursor:pointer;
  border-bottom:4px solid transparent;transition:background .12s}
mark.mk.on{border-bottom-style:solid}
mark.mk.on:hover{filter:brightness(.97)}
mark.mk .pin{display:none}
mark.mk.on .pin{display:inline-block;font-size:20px;line-height:1;vertical-align:-2px;margin:0 0 0 3px}
mark.gr{background:#FFF3B0;box-shadow:0 0 0 2px #FFF3B0}

/* ───── selos na faixa ───── */
.selo{position:absolute;right:5px;width:68px;background:#fff;border:4px solid #fff;border-radius:13px;
  text-align:center;padding:4px 1px 3px;cursor:pointer;z-index:6}
.selo .e{display:block;font-size:22px;line-height:1.15}
.selo .p{display:block;font-size:11.5px;line-height:1.15;font-weight:700;margin:1px 0 0;
  word-break:break-word;hyphens:auto}
.selo .st{position:absolute;top:-9px;left:-9px;width:23px;height:23px;border-radius:50%;
  background:var(--faixa);border:3px solid #fff;font-size:12px;line-height:17px}
.selo.eco{opacity:.28}

/* ───── janela ───── */
.jan{position:fixed;inset:0;background:rgba(8,12,10,.62);z-index:90;display:flex;
  align-items:flex-end;justify-content:center;padding:14px}
.jancx{background:#fff;border:4px solid var(--tinta);border-radius:20px;padding:16px;
  width:100%;max-width:560px;max-height:84vh;overflow:auto}
.jantt{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px;margin:0 0 4px}
.jantt .e{font-size:27px}
.jancit{border-left:8px solid var(--linha);padding:7px 0 7px 12px;margin:11px 0;font-size:16px;font-style:italic}
.janl{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-size:16px}
.janl .e{font-size:22px;line-height:1.2;flex:none}
.fechar{margin:13px 0 0;width:100%;border:4px solid var(--tinta);background:var(--tinta);color:#fff;
  border-radius:15px;padding:13px;font:700 17px/1 inherit;cursor:pointer}

/* ───── rodapé ───── */
#rod{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--tinta);
  padding:9px 12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#rod button{border:4px solid #fff;background:transparent;color:#fff;border-radius:14px;
  padding:11px 13px;font:700 16px/1 inherit;cursor:pointer}
#rod button:disabled{opacity:.38;cursor:default}
/* 🔴 CLD-052 · o Próximo roxo (CLD-043 P.1). Antiga: #rod .pr{background:#fff;color:var(--tinta);margin-left:auto} */
#rod .pr{background:#6A1B9A;color:#fff;border-color:#fff;margin-left:auto;box-shadow:0 0 0 3px #CE93D8}
#rod .pr:disabled{background:#6A1B9A}
/* 🔴 CLD-052 · a tela do texto em CAMADAS: o card que diz o que entrou nesta tela */
.camcard{background:#fff;border:4px solid #6A1B9A;border-radius:16px;padding:12px 14px;margin:0 0 14px}
.camcard .camtt{font-size:19px;font-weight:900;color:#4A148C;margin-bottom:6px}
.camcard .camln{font-size:17px;margin:5px 0;line-height:1.35}
.camcard .camln.novo{font-weight:900;color:#1B5E20}
.camcard .camln.ja{color:#455A64}
.camtrilha{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.camtrilha span{border:3px solid #CE93D8;border-radius:10px;padding:3px 9px;font-weight:800;font-size:15px;color:#6A1B9A;background:#F3E5F5}
.camtrilha span.on{background:#6A1B9A;color:#fff;border-color:#4A148C}

/* ───── perguntas ───── */
.alts{display:block}
.alt{display:block;width:100%;text-align:left;background:#fff;border:4px solid var(--linha);
  border-radius:15px;padding:12px 14px;margin:0 0 11px;cursor:pointer;font:inherit;color:inherit}
.alt .L{font-weight:700;margin:0 8px 0 0}
.alt.sel{border-color:var(--tinta)}
.gol{width:80%;border:4px solid;border-radius:15px;padding:10px 12px;margin:0 0 11px}
.gol .cab{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.gol .cab .tri{font-size:25px;letter-spacing:2px}
.gol .j{font-size:15.5px;margin:5px 0 0}
.g-gol{border-color:#2E7D32;background:#E8F5E9}
.g-imp{border-color:#EF6C00;background:#FFF3E0}
.g-trave{border-color:#F9A825;background:#FFFDE7}
.g-fora{border-color:#5C6BC0;background:#E8EAF6}
.g-contra{border-color:#C62828;background:#FFEBEE}
.dica{width:80%;border:4px solid var(--laranja);background:var(--laranjaf);
  border-radius:15px;padding:10px 12px;margin:0 0 12px;font-size:15.5px}

/* ───── sumário ───── */
.sumjan{position:fixed;inset:0;background:rgba(8,12,10,.62);z-index:95;display:flex;
  align-items:flex-end;justify-content:center;padding:12px}
.sumcx{background:#fff;border:4px solid var(--tinta);border-radius:20px;padding:15px;
  width:100%;max-width:560px;max-height:84vh;overflow:auto}
.sumtt{font-size:20px;font-weight:700}
.sumsb{font-size:14px;opacity:.8;margin:0 0 10px}
.sumparte{font-size:16px;font-weight:700;background:var(--tinta);color:#fff;
  border-radius:11px;padding:7px 11px;margin:12px 0 8px}
.suml{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;
  border:4px solid var(--linha);border-radius:14px;padding:9px 11px;margin:0 0 8px;cursor:pointer;font:inherit;color:inherit}
.suml .sumn{display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;
  border-radius:9px;background:#EDF2EF;font-weight:700;font-size:15px;flex:none}
.suml .sumst{font-size:20px;flex:none}
.suml .sumtx b{display:block;font-size:16px}
.suml .sumtx span{display:block;font-size:14px;opacity:.8}
.suml.aqui{border-color:var(--tinta)}
.suml.trav{opacity:.55;cursor:default}

.nota{border:4px solid var(--tinta);border-radius:15px;background:#fff;padding:11px 13px;font-size:16px}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.legi{display:flex;align-items:center;gap:9px;background:#fff;border:4px solid var(--linha);
  border-radius:14px;padding:9px 11px}
.legi .e{font-size:24px;flex:none}
.legi b{display:block;font-size:15.5px}
.legi span{display:block;font-size:13.5px;opacity:.8}

/* ══════════════════════════════════════════════════════════════════
   🔴 CLD-011 · PADRONIZADOR_002 · A FORMA PASSA A SER A DA BASE
   Regra da base única (CMD-21): a base viva é a RETOMADA 2ª AAIM V09.80. Cada valor
   abaixo foi LIDO no DOM do arquivo 26.09.30_C464_REV_2AAIM-U02_9ano_..._ESTUDANTE.html,
   não escolhido aqui. As regras antigas deste arquivo ficam acima, sobrepostas — nada apagado.
   ══════════════════════════════════════════════════════════════════ */
#topo{display:none}  /* DESATIVADO CLD-011 · o topo virou #statusbar + #idbar, cópia da base */
#statusbar{position:sticky;top:0;z-index:75;background:#fff;padding:6px 12px;display:flex;gap:6px;
  flex-wrap:wrap;row-gap:5px;border-bottom:3px solid #6B4B9C;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.chip{font-size:16px;font-weight:800;padding:3px 10px;border-radius:14px;background:#EEF4F2;color:#6E6E6E;
  max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ver{background:#6B4B9C;color:#fff}
.chip.tela{background:#2E6029;color:#fff}
.chip.etapa{background:#EEF4F2;color:#4A5C64;border:2px solid #D3DEDB}
.chip.nota{color:#B3001B}
.chip.tcbtn{background:#FFFFFF;color:#1B5E20;border:3px solid #2E7D32;cursor:pointer;font-family:inherit}
.chip.sai{background:#FDECEA;color:#B71C1C;border:3px solid #E57373}
#cronoBox{background:#17242B;color:#fff;border-radius:16px;padding:4px 13px;font-weight:800;letter-spacing:1px;font-size:16px}
#statusbar .espaco{flex:1 1 100%;height:0}
#idbar{background:#fff;border-bottom:4px solid #6B4B9C;padding:8px 14px;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#idbar .l1{font-size:16px;font-weight:800;color:#6B4B9C;line-height:1.15}
#idbar .l2{font-size:16px;font-weight:900;color:#2E6029;line-height:1.15}
#idbar .l2 .unid{color:#7B2D8E;letter-spacing:1px}
#idbar .l3{font-size:16px;color:#6E6E6E;line-height:1.15}
.em20{font-size:max(20px,1em);line-height:1;vertical-align:-2px;display:inline-block;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}

/* identificação · .secab .campo .subn .obr .turmabtn #inNum · copiados da base */
.secab{background:var(--csbg,#F7F3FB);border:3px solid var(--cs,#7B2D8E);border-top-width:8px;
  border-radius:16px;padding:20px 22px;margin-bottom:16px}
.secab>.sect{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--cs,#7B2D8E);margin-bottom:12px;line-height:1.15}
.secab>.sect .secn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--cs,#7B2D8E);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;letter-spacing:0;
  box-shadow:0 2px 6px rgba(0,0,0,.18)}
.campo{margin-bottom:14px}
.campo label{display:flex;align-items:center;font-size:16px;font-weight:800;color:#6E6E6E;margin-bottom:5px}
.subn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:32px;height:32px;
  border-radius:50%;margin-right:9px;background:var(--cs2,#0C7064);color:#fff;font-size:16px;font-weight:900;
  box-shadow:0 1px 4px rgba(0,0,0,.14)}
.obr{color:#C62828;font-size:22px;font-weight:900;line-height:1;margin-left:6px}
.dicanome{font-size:16px;color:#4A5C66;margin:-2px 0 7px;line-height:1.4}
.campo input{width:100%;padding:13px;border:3px solid #8FA3B5;border-radius:12px;font-size:17px;font-family:inherit}
.campo input#inNum{width:118px;text-align:center;font-size:20px;font-weight:900}
.turmagrid{display:flex;gap:8px;flex-wrap:wrap}
.turmabtn{min-width:74px;padding:11px 14px;border:3px solid;border-radius:12px;font-size:17px;font-weight:900;
  cursor:pointer;font-family:inherit}

/* o tique · quadrado no canto, verde quando marcado · cópia do .m7autick do mapa da base */
.esc .tick{position:absolute;top:10px;right:10px;width:34px;height:34px;border:3px solid #78909C;
  border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;line-height:1;color:#fff}
.esc.on .tick{background:#2E7D32;border-color:#1B5E20;color:#fff}

/* a faixa vazia não pode sumir no escuro · amarelo #FFD34E, o mesmo destaque da base */
#faixa .vazio{color:#FFD34E;font-weight:900;font-size:16px;opacity:1}

/* 🔴 a entrelinha · o fio passa no VÃO entre as linhas, não por cima das palavras */
.tx{line-height:2.35}
.selo .st{width:30px;height:30px;top:-12px;left:-12px;font-size:20px;line-height:24px}

/* o gênero em destaque, ligado à faixa por fio */
.gen{display:inline-flex;align-items:center;gap:6px;background:#6B4B9C;color:#fff;font-weight:900;
  border-radius:14px;padding:3px 12px;font-size:16px;cursor:pointer;border:3px solid #4A2C7D}
/* o card do parágrafo abre a explicação de como ele se constrói */
.parcab .como{margin-left:auto;border:3px solid var(--tinta);background:#fff;border-radius:12px;
  padding:3px 10px;font-family:inherit;font-weight:800;font-size:15px;line-height:1.2;cursor:pointer}
.par.estr .parcab{cursor:pointer}
/* o ❓ vermelho antes da frase · a frase é a resposta */
.qk{display:inline-block;font-size:20px;line-height:1;cursor:pointer;margin:0 4px 0 0;vertical-align:-2px;
  border:3px solid #C62828;border-radius:8px;padding:1px 2px;background:#FDEDED}
.chave{display:inline-block;background:#C62828;color:#fff;font-weight:900;border-radius:9px;padding:2px 9px;font-size:15px;margin-right:6px}
.cumpre{display:flex;gap:9px;align-items:flex-start;margin:8px 0;font-size:16px}

/* 🔴 CLD-011 · a tela da pergunta · .croxo .cp-cmd .conector .altletra copiados da base;
   a zona da letra com fundo próprio e separador é pedido do Marcos (01/10 05:57) e ainda
   precisa SUBIR para a base RETOMADA, na mão, quando o build dela voltar a rodar. */
.croxo{border:3px solid #B83D3D;border-left:9px solid #B83D3D;background:#FDF1F3;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.cp-cmd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:#8E1B2B;letter-spacing:.4px;
  text-transform:uppercase;margin-bottom:9px}
.ctxnum{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:#6B4B9C;color:#fff;font-size:17px;font-weight:900;flex:none;border:3px solid #4A2C7D}
.qbox{background:#fff;border:3px solid #8E1B2B;border-radius:12px;padding:12px 16px}
.qlab{font-size:15px;font-weight:900;color:#B83D3D;letter-spacing:1px;margin-bottom:4px}
.qbox h3{margin:0;font-size:20px;line-height:1.5;color:#22303A}
.conector{margin-top:10px;font-size:17px;font-weight:800;color:#7A2230;border-top:2px dashed #E0A9B2;padding-top:9px}
mark.grq{background:#FFF3B0;box-shadow:0 0 0 2px #FFF3B0;color:inherit;border-radius:4px}
.tchip{display:inline;background:#EAF3FB;border-bottom:3px solid #2E5C8A;color:#1B4A7A;font-weight:800;
  padding:0 3px;border-radius:5px 5px 0 0;cursor:pointer}
.tchip.lido{background:#E3F5DE;border-bottom-color:#3E8C2E;color:#1B6B08}
/* 🔴 CLD-035 · Marcos, 02/10 01:42: "tela 3 · não consegui ler: quase o mesmo tom do fundo". Era cinza #4A5C66 direto
   sobre o fundo verde-escuro da questão. Antiga, desativada: .glosaviso{font-size:16px;color:#4A5C66;margin:0 0 12px} */
.glosaviso{font-size:16px;color:#1E2A36;margin:0 0 12px;background:#fff;border:4px solid #2E5C8A;border-radius:12px;padding:8px 12px}
.glosaviso b{color:#1A4F80}
.alt.alt2{display:flex;align-items:stretch;padding:0;overflow:hidden;background:#F4F8FC;border:3px solid #C3D6E8;
  border-radius:14px;font-size:17px;line-height:1.45}
.alt2 .altl{flex:none;display:flex;align-items:center;padding:10px 12px;background:#DCE7F2;border-right:3px solid #C3D6E8}
.alt2 .altletra{width:38px;height:38px;border-radius:11px;background:#2E5C8A;color:#fff;font-size:20px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.alt2 .frase{flex:1;padding:13px 16px}
.alt2.sel{outline:5px solid #7B2D8E;outline-offset:2px}
.alt2.certo .altletra{background:#2E7D32} .alt2.certo{border-color:#2E7D32}
.alt2.errado .altletra{background:#C62828} .alt2.errado{border-color:#C62828}
.chip.notac{color:#B3001B}

/* ══ 🔴 CLD-013 · o fundo por tipo de tela e os emojis da lateral · copiados da base ══ */
body.m7f-tema,body.m7f-vf,body.m7f-lac,body.m7f-disc,body.m7f-placar,body.m7f-final{background-attachment:fixed;

<script>
/* ══════════════════════════════════════════════════════════════════
   DADOS · Recuperação 3º bimestre · 9º ano · Língua Portuguesa
   Texto: "A Tela que Desliga o Saber" · artigo de opinião
   CLD-404 · V01.00 · N.05.01.00_PADRONIZADOR_001
   ══════════════════════════════════════════════════════════════════ */

/* 🔴 OS DOIS EIXOS DO GRIFO CLASSIFICATORIO · Marcos, 29/09 08:45
   Eixo 1 · TIPO    · de que natureza e' o trecho
   Eixo 2 · ESTAGIO · onde no problema ele esta'
   A comparacao do Marcos: e' bula de remedio. Sintoma → consequencia → remedio/escudo. */

var TIPOS = {
  cog: {emo:"🧠", nome:"cognitivo",      cor:"#2E5C8A", fundo:"#E8EFF6", diz:"tem a ver com pensar, aprender e prestar atenção"},
  soc: {emo:"👥", nome:"social",         cor:"#3F7A35", fundo:"#E9F3E6", diz:"tem a ver com conviver com as outras pessoas"},
  emo: {emo:"😟", nome:"emocional",      cor:"#B4306B", fundo:"#FBE9F1", diz:"tem a ver com o que a pessoa sente por dentro"},
  se:  {emo:"🤝", nome:"socioemocional", cor:"#7B3FA0", fundo:"#F2E9F7", diz:"é social e emocional ao mesmo tempo: o convívio mexe com o sentimento"}
};

var ESTAGIOS = {
  sin: {emo:"🔍", nome:"sintoma",     diz:"é o que aparece, o sinal de que tem algo errado"},
  con: {emo:"➡️", nome:"consequência", diz:"é no que aquilo dá, o resultado"},
  tra: {emo:"💊", nome:"tratamento",   diz:"é o remédio, o que fazer com o problema que já existe"},
  pre: {emo:"🛡️", nome:"prevenção",   diz:"é o escudo, o que fazer para o problema não acontecer"}
};

/* 🔴 O PRIMEIRO GRIFO · a estrutura do genero, pela norma
   Artigo de opiniao: cada paragrafo tem funcao fixa. E' isso que a pergunta 1 e a 3 cobram. */
var FUNCOES = {
  f1: {n:"1", rot:"Contextualização e tese",  diz:"apresenta a cena e diz o que o autor vai defender"},
  f2: {n:"2", rot:"Argumento de autoridade",  diz:"traz estudo e explicação de especialista para sustentar a tese"},
  f3: {n:"3", rot:"Argumento testemunhal",    diz:"mostra a cena do dia a dia que qualquer um reconhece"},
  f4: {n:"4", rot:"Concessão e refutação",    diz:"dá razão ao outro lado e depois vira: é o parafuso do texto"},
  f5: {n:"5", rot:"Conclusão e proposta",     diz:"retoma a tese e aponta o caminho"}
};

var TITULO = "A Tela que Desliga o Saber";
var GENERO = "Artigo de opinião";

/* 🔴 CLD-011 · PADRONIZADOR_002 · COMO SE CONSTRÓI CADA PARÁGRAFO DO GÊNERO.
   Marcos, 01/10 05:51: "como construir cada parágrafo ... e incluir onde for possível,
   para ajudar a responder, em forma de perguntas, as 07 chaves 5W2H".
   🔵 A ordem e o conteúdo vêm do GÊNERO TEXTUAL (dissertativo-argumentativo), não da ABNT:
   a ABNT normatiza formatação e citação, não a estrutura do artigo. Por isso o rótulo na
   tela é "estrutura do gênero".
   `linhas` é orientação para uma folha de redação de até 30 linhas, não regra.
   `deve` = o que o parágrafo precisa ter · `perg` = as perguntas, com a chave do 5W2H. */
var ESTRUTURA = {
  f1: {linhas:"4 a 6", deve:["mostrar a cena do problema","dizer a opinião do autor (a tese)"],
       perg:[{k:"ONDE",  p:"Onde e quando o problema acontece?"},
             {k:"O QUÊ", p:"O que está acontecendo?"},
             {k:"O QUÊ", p:"O que eu defendo? Essa é a tese."}]},
  f2: {linhas:"5 a 7", deve:["trazer um estudo, uma lei ou um especialista","explicar por que isso apoia a tese"],
       perg:[{k:"POR QUÊ", p:"Por que a minha opinião está certa?"},
             {k:"QUEM",    p:"Quem comprova o que eu digo?"}]},
  f3: {linhas:"4 a 6", deve:["mostrar um exemplo que todo mundo reconhece","ligar o exemplo à tese"],
       perg:[{k:"ONDE", p:"Onde isso aparece no dia a dia?"},
             {k:"QUEM", p:"Quem sofre com isso?"}]},
  f4: {linhas:"4 a 6", deve:["dar razão ao outro lado em um ponto","virar o argumento com «contudo», «porém» ou «mas»"],
       perg:[{k:"O QUÊ",   p:"O que o outro lado diz que é verdade?"},
             {k:"POR QUÊ", p:"Por que, mesmo assim, a minha tese vale?"},
             {k:"COMO",    p:"Como fazer do jeito certo?"}]},
  f5: {linhas:"3 a 5", deve:["retomar a tese","propor uma solução"],
       perg:[{k:"O QUÊ", p:"O que deve ser feito?"},
             {k:"QUEM",  p:"Quem deve fazer?"},
             {k:"COMO",  p:"Como fazer?"}]}
};
/* 🔴 CLD-011 · ESTE TEXTO CUMPRE? · a prova de cada item de `deve`, com o trecho do texto.
   Mesma ordem de ESTRUTURA[f].deve. Trecho vazio = o parágrafo não cumpre aquele item. */
var CUMPRE = {
  f1: ["O sinal toca, os alunos entram na sala e (…) os celulares já estão a postos.",
       "É urgente discutir o papel real do smartphone no ambiente escolar."],
  f2: ["Estudos demonstram que a simples presença do celular por perto já reduz a capacidade de concentração.",
       "O cérebro em desenvolvimento (…) precisa de pausas e de esforço sustentado para aprender."],
  f3: ["O recreio (…) transformou-se em um deserto de silêncio coletivo.",
       "Esse isolamento digital alimenta quadros de ansiedade."],
  f4: ["É evidente que a tecnologia tem valor pedagógico inegável.",
       "Contudo, o uso educativo deve ser intencional, planejado e mediado pelo professor."],
  f5: ["Proibir ou restringir o celular na escola não é fechar portas para o futuro.",
       "A escola precisa continuar sendo o reduto onde o foco (…) resiste à ditadura da distração."]
};

/* Cada paragrafo e' uma lista de pedacos.
   String pura  = texto sem marca.
   {m:"..."}    = trecho marcado, com tipo, estagio, palavra articuladora e o porque.
   {q:"..."}    = 🔴 CLD-011 · o ❓ vermelho ANTES da frase: a pergunta que a frase responde,
                  com a chave do 5W2H. Marcos, 01/10 05:51: "o emoji antes da frase, como se
                  a frase fosse a resposta". */
var TEXTO = [
{f:"f1", p:[
  {q:"qq01", k:"ONDE", p:"Onde e quando o problema acontece?"},
  "O sinal toca, os alunos entram na sala e, antes mesmo de abrirem os cadernos, os celulares já estão a postos. A promessa é de que o aparelho serve para acompanhar a aula ou pesquisar termos rápidos. A realidade, no entanto, mostra um cenário bem diferente: ",
  {m:"m01", t:"notificações constantes, redes sociais abertas embaixo da carteira", tipo:"cog", est:"sin", pal:"distração",
   por:"É o que se vê acontecendo na sala, agora, com os olhos. Ainda não é o resultado — é o sinal de que tem algo errado. Por isso é sintoma. E é cognitivo porque ataca direto a atenção, que é a ferramenta de aprender."},
  " e ",
  {m:"m02", t:"uma fragmentação profunda da atenção", tipo:"cog", est:"sin", pal:"atenção",
   por:"«Fragmentação» quer dizer partir em pedaços. A atenção não some: ela se quebra. É sintoma porque descreve o estado em que a atenção fica, não o estrago que isso causa depois."},
  ". ",
  {q:"qq02", k:"O QUÊ", p:"O que o autor defende? Essa é a tese."},
  "É urgente discutir o papel real do smartphone no ambiente escolar."
]},
{f:"f2", p:[
  {q:"qq03", k:"QUANDO", p:"Quando e onde o assunto ganhou força?"},
  "Recentemente, o debate sobre o banimento ou a restrição desses dispositivos ganhou força em leis municipais e federais. Não se trata de uma cruzada antiquada contra a tecnologia, mas de uma constatação cognitiva e social. ",
  {q:"qq04", k:"POR QUÊ", p:"Por que o celular atrapalha o aprender?"},
  {m:"m03", t:"O cérebro em desenvolvimento de crianças e adolescentes precisa de pausas e de esforço sustentado para aprender", tipo:"cog", est:"tra", pal:"pausa",
   por:"Aqui o autor não está mostrando o problema: está dizendo do que o cérebro precisa. É a receita, o remédio. Por isso tratamento, e não sintoma."},
  ". Quando o acesso ao entretenimento instantâneo está a um toque de distância, ",
  {m:"m04", t:"a paciência para ouvir uma explicação longa ou debater um conceito complexo desaparece", tipo:"cog", est:"con", pal:"paciência",
   por:"Isto já é o estrago. A paciência desaparecer é o resultado do celular por perto, não o sinal. Por isso consequência."},
  ". ",
  {q:"qq05", k:"QUEM", p:"Quem comprova o que o autor diz?"},
  "Estudos demonstram que ",
  {m:"m05", t:"a simples presença do celular por perto já reduz a capacidade de concentração", tipo:"cog", est:"sin", pal:"presença",
   por:"É a resposta exata da pergunta 2 da prova. Sintoma porque descreve o efeito imediato da presença, sem nem tocar no aparelho."},
  ", ",
  {m:"m06", t:"prejudicando o desempenho acadêmico", tipo:"cog", est:"con", pal:"nota",
   por:"O desempenho cair é o fim da linha: primeiro a concentração cai (sintoma), depois a nota cai (consequência). O gerúndio «prejudicando» é a pista de que veio depois."},
  "."
]},
{f:"f3", p:[
  {q:"qq06", k:"ONDE", p:"Onde mais o problema aparece?"},
  "Além da sala de aula, ",
  {m:"m07", t:"o recreio — que deveria ser o espaço legítimo da socialização, da corrida, do diálogo olho no olho e até do tédio criativo — transformou-se em um deserto de silêncio coletivo", tipo:"soc", est:"sin", pal:"recreio",
   por:"É a resposta da pergunta 3. Social porque fala do convívio, não do aprender. Sintoma porque é a cena que se vê — «deserto de silêncio» é a imagem do sinal."},
  ", onde dezenas de jovens olham para telas individuais. ",
  {q:"qq07", k:"O QUÊ", p:"O que o isolamento causa?"},
  {m:"m08", t:"Esse isolamento digital", tipo:"se", est:"sin", pal:"sozinho",
   por:"Aqui os dois eixos se encontram: estar sozinho é social, sentir-se sozinho é emocional. Por isso socioemocional. É o trecho que amarra o parágrafo inteiro."},
  " alimenta ",
  {m:"m09", t:"quadros de ansiedade", tipo:"emo", est:"con", pal:"ansiedade",
   por:"Emocional puro: é o que a pessoa sente por dentro. Consequência porque o verbo «alimenta» diz que veio do isolamento, que é o sintoma anterior."},
  ", ",
  {m:"m10", t:"comparações tóxicas", tipo:"emo", est:"sin", pal:"comparar",
   por:"Comparar-se com os outros é o sinal, o que acontece enquanto se rola a tela. A ansiedade é o que vem depois. Por isso este é sintoma e o anterior, consequência."},
  " e ",
  {m:"m11", t:"prejudica o desenvolvimento de habilidades sociais indispensáveis para a vida adulta", tipo:"soc", est:"con", pal:"convívio",
   por:"É o estrago de longo prazo: não é o que acontece hoje no recreio, é o que falta lá na frente. Consequência, e social porque fala de habilidade de conviver."},
  "."
]},
{f:"f4", p:[
  {q:"qq08", k:"O QUÊ", p:"O que o outro lado tem de certo?"},
  "É evidente que a tecnologia tem valor pedagógico inegável. ",
  {q:"qq09", k:"POR QUÊ", p:"Por que a tese continua valendo?"},
  "Contudo, ",
  {m:"m12", t:"o uso educativo deve ser intencional, planejado e mediado pelo professor", tipo:"cog", est:"tra", pal:"mediação",
   por:"É a resposta da pergunta 4. Tratamento porque diz o que fazer, não o que está errado. As três palavras — intencional, planejado, mediado — são a receita."},
  ", ",
  {q:"qq10", k:"COMO", p:"Como usar a tecnologia do jeito certo?"},
  "utilizando ",
  {m:"m13", t:"ferramentas da própria escola — como computadores ou tablets institucionais", tipo:"cog", est:"tra", pal:"escola",

  "."
]},
{f:"f5", p:[
  {q:"qq11", k:"O QUÊ", p:"O que o autor propõe?"},
  {m:"m15", t:"Proibir ou restringir o celular na escola", tipo:"se", est:"pre", pal:"regra",
   por:"Prevenção, não tratamento: a regra existe para o problema não chegar, não para curar quem já está preso à tela. Socioemocional porque a regra protege o convívio e o que ele faz sentir."},
  " não é fechar portas para o futuro, mas abrir espaço para o presente. ",
  {q:"qq12", k:"POR QUÊ", p:"Por que a escola precisa fazer isso?"},

  TEXTO.forEach(function(P,i){

/* 🔴 A FAIXA VERTICAL COM SERRILHADO · o pedido do Marcos de 29/09 08:45:
   "uma seta ou serrilhado que ligue a frase ate o emoji que combine com a classificacao,
   e a palavra que articula o emoji ao contexto".
   O selo nasce na altura do trecho; se dois brigam pelo mesmo lugar, o de baixo desce. */
function desenharFaixa(){
  var fx=$("faixa"), fios=$("fios"), area=$("area");
  fx.innerHTML=""; fios.innerHTML="";
  /* 🔴 medido no CLD-404: o minHeight da tela anterior ficava preso e a tela de perguntas
     nascia com metros de vazio embaixo. Zera antes de medir de novo. */
  fx.style.minHeight="";
  if(!CAM.cls){ fx.innerHTML='<div class="vazio">marcas<br>desligadas</div>'; return }
  var base=area.getBoundingClientRect();
  fios.setAttribute("width", base.width); fios.setAttribute("height", base.height);
  fios.setAttribute("viewBox","0 0 "+base.width+" "+base.height);
  var fila=[];
  /* 🔴 CLD-011 · o gênero também ganha selo e fio, como as marcas */
  var gp=document.getElementById("genPill");
  if(gp){ var gr=gp.getBoundingClientRect(), gc=gp.closest(".card");
    fila.push({gen:true, x:{m:"__gen", pal:"gênero"}, y:gr.top-base.top+gr.height/2,
               ax:gr.right-base.left, ay:gr.bottom-base.top+6,
               marg:gc?(gc.getBoundingClientRect().right-base.left-18):null}) }
  document.querySelectorAll("mark.mk").forEach(function(el){
    var x=MARCAS[el.dataset.m]; if(!x) return;
    var r=el.getBoundingClientRect();
    var y=r.top-base.top+r.height/2;
    /* 🔴 CLD-011 · O FIO SAI POR BAIXO DA PALAVRA, NO VÃO ENTRE AS LINHAS.
       Marcos, 01/10 05:51: "os serrilhados sobrepõem as palavras do texto ... no parágrafo
       03 e 05 cobre de forma que mal dá para ler". O fio saía do MEIO da última linha do
       trecho e atravessava o resto da linha, por cima das letras. Agora ele parte do fim da
       última linha do trecho e corre no meio do vão até a margem (entrelinha 2,35). */
    var rs=el.getClientRects(), u=rs[rs.length-1]||r;
    var tx=el.closest(".tx"), lh=tx?parseFloat(getComputedStyle(tx).lineHeight):u.height*2;
    var vao=Math.max(4,(lh-u.height)/2);
    fila.push({x:x, y:y, ax:u.right-base.left, ay:u.bottom-base.top+vao, marg:tx?(tx.getBoundingClientRect().right-base.left):null});
  });
  var W=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--FAIXA_W"))||58;
  /* 🔴 LICAO MEDIDA · CLD-404: eu tinha cravado o passo em 62px, chutando a altura do selo.
     Selo com palavra de duas linhas passa de 70px e cinco deles se sobrepuseram.
     A regra agora e' a mesma da grade de cards: nunca cravar numero, medir o que existe.
     Passagem 1 desenha e mede · passagem 2 empurra para baixo com a altura real. */
  fila.forEach(function(f){
    var T=f.gen?{fundo:"#EDE6F5",cor:"#6B4B9C",emo:"📐"}:TIPOS[f.x.tipo], E=f.gen?{emo:"🧭"}:ESTAGIOS[f.x.est];
    var d=document.createElement("div");
    d.className="selo"; d.style.top=(f.y-27)+"px";
    d.style.background=T.fundo; d.style.borderColor=T.cor;
    d.onclick=f.gen?abrirGenero:function(){ abrirMarca(f.x.m) };
    d.innerHTML='<span class="st" style="color:#fff">'+E.emo+'</span>'+
                '<span class="e">'+T.emo+'</span>'+
                '<span class="p" style="color:'+T.cor+'">'+esc(f.x.pal)+'</span>';
    fx.appendChild(d);
    /* o fio: sai do fim do trecho e chega na borda esquerda da faixa */
    var xf=base.width-W-22, x0=Math.min(f.ax+4, xf-6);
    var p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",caminhoFio(x0,f.ay,xf,f.y,f.marg));
    p.setAttribute("stroke",T.cor); p.setAttribute("stroke-width","3");
    p.setAttribute("stroke-dasharray","2 5"); p.setAttribute("stroke-linecap","round");
    p.setAttribute("fill","none");
    fios.appendChild(p);
    var pt=document.createElementNS("http://www.w3.org/2000/svg","circle");
    pt.setAttribute("cx",x0); pt.setAttribute("cy",f.ay); pt.setAttribute("r","4");
    pt.setAttribute("fill",T.cor);
    fios.appendChild(pt);
  });
  if(!fila.length){ fx.innerHTML='<div class="vazio">sem<br>marcas<br>aqui</div>'; return }

  /* passagem 2 · empurra para baixo o que encostou, e refaz o fio de quem se mexeu */
  var selos=fx.querySelectorAll(".selo"), paths=fios.querySelectorAll("path"), piso=-9999;
  for(var i=0;i<selos.length;i++){
    var alt=selos[i].offsetHeight || 60;
    var topo=parseFloat(selos[i].style.top);
    if(topo < piso+6) topo = piso+6;
    selos[i].style.top=topo+"px";
    piso = topo+alt;
    var meio=topo+alt/2, f=fila[i];
    var xf=base.width-W-22, x0=Math.min(f.ax+4, xf-6);
    paths[i].setAttribute("d",caminhoFio(x0,f.ay,xf,meio,f.marg));
  }
  /* a faixa precisa ser alta o bastante para caber o ultimo selo */
  fx.style.minHeight = Math.max(base.height, piso+14)+"px";
}

/* 🔴 CLD-011 · o desenho do fio: reto no vão até passar da margem do texto, e só então a
   curva até o selo. A curva fica fora do texto, na sobra entre o card e a faixa. */
function caminhoFio(x0,y0,xf,y1,marg){
  var xm=(marg!=null)?Math.min(Math.max(marg+4,x0),xf-8):x0;
  return "M "+x0+" "+y0+" L "+xm+" "+y0+" C "+((xm+xf)/2)+" "+y0+", "+((xm+xf)/2)+" "+y1+", "+xf+" "+y1;
}

/* 🔴 CLD-011 · A TELA DA PERGUNTA NO PADRÃO DA BASE */
var GLOS_LIDO={};
var NUMERAL=["","uma","duas","três","quatro","cinco","seis"];
/* marca o texto: pastilha de glossário (azul) e grifo do enunciado (amarelo), sem mexer em tag */
function marcarTexto(txt, grifos){
  var raw=String(txt), low=raw.toLowerCase(), sp=[];
  function livre(a,b){ return !sp.some(function(x){ return a<x.b && b>x.a }) }
  function borda(i){ return i<0 || i>=raw.length || !/[A-Za-zÀ-ÿ0-9]/.test(raw[i]) }
  if(CAM.glq) Object.keys(GLOS).sort(function(x,y){return y.length-x.length}).forEach(function(t){
    var k=low.indexOf(t.toLowerCase());
    while(k>=0){ var e=k+t.length;
      if(borda(k-1)&&borda(e)&&livre(k,e)){ sp.push({a:k,b:e,t:"g",termo:t}); break }
      k=low.indexOf(t.toLowerCase(),k+1) }
  });
  (CAM.grq?(grifos||[]):[]).forEach(function(g){
    var k=low.indexOf(g.toLowerCase());
    if(k>=0 && livre(k,k+g.length)) sp.push({a:k,b:k+g.length,t:"r"});
  });
  sp.sort(function(x,y){return x.a-y.a});
  var h="", i=0;
  sp.forEach(function(x){
    h+=esc(raw.slice(i,x.a));
    var w=esc(raw.slice(x.a,x.b));
    if(x.t==="g") h+='<span class="tchip'+(GLOS_LIDO[x.termo]?" lido":"")+'" role="button" tabindex="0" '+
      'onclick="event.stopPropagation();abrirGlos(\''+x.termo+'\')">'+w+'</span>';
    else h+='<mark class="grq">'+w+'</mark>';
    i=x.b;
  });
  return h+esc(raw.slice(i));
}

/* sorteio fixo por questão: a certa nunca fica sempre no mesmo lugar */
function hx(s){ var a=2166136261; s=String(s); for(var i=0;i<s.length;i++){ a^=s.charCodeAt(i); a=Math.imul(a,16777619)>>>0 } return a }
function ordem(n,chave){ var o=[]; for(var i=0;i<n;i++) o.push(i); return o.sort(function(a,b){ return hx(chave+"#"+a)-hx(chave+"#"+b) }) }

function chaveR(r){ return r.t==="obj" ? "obj_"+r.q : (r.t==="fase" ? "fase_"+r.q+"_"+r.f : null) }
function acertou(r){ var k=chaveR(r), g=RS[k]; if(!g||!g.conf) return null;
  if(r.t==="obj"){ var a=altsObj(PERG_DE[r.q]).filter(function(x){return x.L===g.sel[0]})[0]; return !!(a&&a.c==="gol") }
  var fr=frasesFase(r.q,r.f), ok=fr.filter(function(x){return x.ok}).map(function(x){return x.L}).sort().join("");
  return g.sel.slice().sort().join("")===ok }

function placarObj(oi){
  var its=R.filter(function(r){ return r.o===oi && (r.t==="obj"||r.t==="fase") }), pts=0, tot=0, linhas=[];
  var o=OBJETIVOS[oi];
  if(o.q){
    var ro=its.filter(function(r){return r.t==="obj"})[0], ao=acertou(ro);
    var fs=its.filter(function(r){return r.t==="fase"}), fc=fs.filter(function(r){return acertou(r)}).length;
    /* 🔴 CLD-072 · Marcos, 02/10 19:48: "na dissertativa a correção ou é 0,50 ou 1,00". A mesma régua da RETOMADA:
       errou no máximo 1 parte = 1,00 · errou 2 ou mais = 0,50 · não fez nenhuma = 0,00.
       Antiga (proporcional, desativada): pts=(ao?1:0)+fc/5; tot=2; */
    var feitas=fs.filter(function(r){ return acertou(r)!==null }).length;
    var disc=feitas ? ((fs.length-fc)<=1 ? 1 : 0.5) : 0;
    pts=(ao?1:0)+disc; tot=2;
    linhas.push([ao,"objetiva · "+NAV_DA_Q[o.q]]);
    fs.forEach(function(r){ linhas.push([acertou(r),"dissertativa · parte "+(r.f+1)+" · "+DISC_DE[r.q].fases[r.f].k+" · NAV.0"+(r.f+1)]) });
  } else {
    its.forEach(function(r){ var a=acertou(r); pts+=a?1:0; tot++; linhas.push([a,"objetiva · "+PERG_DE[r.q].de+" · "+NAV_DA_Q[r.q]]) });
  }

var ETEC_ABREV = /(^|\s)(Sr|Sra|Srs|Dr|Dra|Prof|Profa|nº|n|p|pág|págs|ex|aprox|cap|vol|fig|séc|av|tel|obs)\.$/i;
var ETEC_VOID = /^<(br|img|input|hr|wbr|meta|source)\b/i;
function etecFrases(html){
  var partes = String(html||"").split(/(<[^>]*>)/), fundo = 0, cur = "", out = [];
  for(var i=0;i<partes.length;i++){
    var p = partes[i];
    if(!p) continue;
    if(p.charAt(0)==="<"){
      if(/^<\//.test(p)) fundo = Math.max(0, fundo-1);
      else if(!ETEC_VOID.test(p) && !/\/>$/.test(p)) fundo++;
      cur += p; continue;
    }
    if(fundo>0){ cur += p; continue }
    /* corta depois de . ! ? … quando a próxima palavra começa com maiúscula, número ou aspas */
    var rx = /([.!?…]+["”’»)]*)(\s+)(?=[A-ZÁÉÍÓÚÂÊÔÃÕÀÇ0-9"“«(—–])/g, ult = 0, m;
    while((m = rx.exec(p))){
      var ate = m.index + m[1].length, pedaco = cur + p.slice(ult, ate);
      if(ETEC_ABREV.test(p.slice(Math.max(0,m.index-6), ate))){ continue }
      out.push(pedaco); cur = ""; ult = ate + m[2].length;

      if(temQuebra && /^\s*[A-ZÁÉÍÓÚÂÊÔÃÕÀÇ0-9"“«(—–]/.test(prox) && !ETEC_ABREV.test(resto.slice(0, fim.index+fim[1].length).slice(-8))){
        out.push(cur + resto.slice(0, fim.index+fim[1].length)); cur = ""; continue;
      }
    }
    cur += resto;
  }

function etecLinhas(el){

            if((lw==="um"||lw==="uma") && !/(só|apenas)\s*$/i.test(ant) && !UMOK.test(pr.trim()?pr:(dep.match(/^\s*[A-Za-zÀ-ÿ]*/)||[""])[0])) return m;
            var d=dois(wd); if(!d) return m; mudou=true; return sp+"\u0001"+d+"\u0002"+pr });
        }
        /* número no fim deste pedaço, "certas" no começo do seguinte */
        if(RXC.test(dep)){
          base=base.replace(RXF,function(m,a,wd,sp){ var d=dois(wd); if(!d) return m; mudou=true; return a+"\u0001"+d+"\u0002"+sp });
        }
        if(mudou) L.push([n,base]);
      });
      L.forEach(function(x){
        var frag=document.createDocumentFragment();
        x[1].split(/(\u0001\d+\u0002)/).forEach(function(s){
          if(!s) return;
          var m=s.match(/^\u0001(\d+)\u0002$/);
          if(m){ var b=document.createElement("b"); b.className="m7n"; b.textContent=m[1]; frag.appendChild(b) }
          else frag.appendChild(document.createTextNode(s));
        });
        if(x[0].parentNode) x[0].parentNode.replaceChild(frag,x[0]);
      });
      return L.length;
    }catch(e){ return 0 }
  }
  window.m7NumCmd=m7NumCmd; window.m7NumCmdTexto=function(t){ var r=trocaTexto(t); return r==null?t:r.replace(/\u0001(\d+)\u0002/g,"[$1]") };
  var agendado=false;
  function agenda(){ if(agendado) return; agendado=true;
    (window.requestAnimationFrame||setTimeout)(function(){ agendado=false; m7NumCmd(document.body) }) }
  try{ new MutationObserver(function(){ agenda() }).observe(document.documentElement,{childList:true,subtree:true,characterData:true}) }catch(e){}
  try{ document.addEventListener("DOMContentLoaded", agenda) }catch(e){}
  agenda();
})();

         if(iT===inicio()) return aberta(); return true }catch(e){ return false }

        document.body.appendChild(b) }
      var v=pode(); if(b.style.display!==(v?"":"none")) b.style.display=v?"":"none";

  };

})();
